<img src="default-user.png"

<h2 style="margin-top:15px;">Administrator</h2>

<p>Property Hub System</p>

</div>

<br>

<form id="adminProfileForm">

<input type="text"
id="adminName"
value="Administrator">

<br><br>

<label>Email</label>

<input type="email"
id="adminEmail"
value="admin@propertyhub.com">

<br><br>

<label>Mobile</label>

<input type="text"
id="adminPhone"
value="9876543210">

<br><br>

<label>Change Password</label>

<input type="password"
id="adminPassword"
placeholder="New Password">

<br><br>

<button type="submit" class="save-btn">
    <i class="fa-solid fa-floppy-disk"></i>
    Save Changes
</button>
