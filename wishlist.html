<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist | Property Hub</title>

    <link rel="stylesheet" href="wishlist.css">
    <link rel="stylesheet" href="theme.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <h2>Property Hub</h2>

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="my-properties.html">Properties</a>
            <a href="wishlist.html" class="active">Wishlist</a>
            <a href="contact-owner.html">Contact Owner</a>

        </nav>

    </header>

    <!-- ================= PAGE TITLE ================= -->

    <section class="page-title">

        <h1>

            <i class="fa-solid fa-heart"></i>

            My Wishlist

        </h1>

        <p>

            Your favourite properties saved for later.

        </p>

    </section>

    <!-- ================= SUMMARY ================= -->

    <section class="wishlist-summary">

        <div class="summary-card">

            <i class="fa-solid fa-heart"></i>

            <h2 id="wishlistCount">0</h2>

            <p>Saved Properties</p>

        </div>

    </section>

    <!-- ================= WISHLIST ================= -->

    <section class="wishlist-section">

        <div id="wishlistContainer">

            <!-- JavaScript will load properties here -->

        </div>

    </section>

    <!-- ================= EMPTY ================= -->

    <div id="emptyWishlist" style="display:none;">

        <i class="fa-regular fa-heart"></i>

        <h2>Your Wishlist is Empty</h2>

        <p>

            Save your favourite properties to see them here.

        </p>

        <a href="my-properties.html">

            Browse Properties

        </a>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Property Hub System | All Rights Reserved.

        </p>

    </footer>

    <script src="wishlist.js"></script>
    <script src="dark-mode.js"></script>

</body>

</html>
