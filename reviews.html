<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Reviews | Property Hub</title>

    <link rel="stylesheet" href="reviews.css">
    <link rel="stylesheet" href="theme.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <header class="header">

        <div class="logo">

            <h2>Property Hub</h2>

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="property-detail.html">Property</a>
            <a href="contact-owner.html">Contact Owner</a>
            <a href="login.html">Login</a>

        </nav>

    </header>
    <section class="page-title">

        <h1>Property Reviews & Ratings</h1>

        <p>See what customers think about this property.</p>

    </section>

    <section class="rating-summary">

        <div class="overall-rating">

            <h2 id="averageRating">4.8</h2>

            <div class="stars">

                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half-stroke"></i>

            </div>

            <p>
                Based on
                <span id="totalReviews">125</span>
                Reviews
            </p>

        </div>

        <div class="rating-bars">

            <div class="bar">
                <span>5 ⭐</span>
                <progress value="90" max="100"></progress>
            </div>

            <div class="bar">
                <span>4 ⭐</span>
                <progress value="70" max="100"></progress>
            </div>

            <div class="bar">
                <span>3 ⭐</span>
                <progress value="30" max="100"></progress>
            </div>

            <div class="bar">
                <span>2 ⭐</span>
                <progress value="10" max="100"></progress>
            </div>

            <div class="bar">
                <span>1 ⭐</span>
                <progress value="5" max="100"></progress>
            </div>

        </div>

    </section>

    <!-- ================= REVIEW FORM ================= -->

    <section class="review-form-section">

        <h2>

            <i class="fa-solid fa-pen-to-square"></i>

            Write a Review

        </h2>

        <form id="reviewForm">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="reviewerName"
                    placeholder="Enter your name"
                    required>

            </div>

            <div class="input-group">

                <label>Review Title</label>

                <input
                    type="text"
                    id="reviewTitle"
                    placeholder="Excellent Property"
                    required>

            </div>

            <div class="input-group">

                <label>Your Rating</label>

                <div class="rating-stars">

                    <i class="fa-regular fa-star star" data-value="1"></i>
                    <i class="fa-regular fa-star star" data-value="2"></i>
                    <i class="fa-regular fa-star star" data-value="3"></i>
                    <i class="fa-regular fa-star star" data-value="4"></i>
                    <i class="fa-regular fa-star star" data-value="5"></i>

                </div>

            </div>

            <div class="input-group">

                <label>Your Review</label>

                <textarea
                    id="reviewMessage"
                    rows="6"
                    placeholder="Write your experience..."
                    required></textarea>

            </div>

            <button type="submit">

                <i class="fa-solid fa-paper-plane"></i>

                Submit Review

            </button>

        </form>

    </section>

    <section class="customer-reviews">

        <h2>

            Customer Reviews

        </h2>

        <div id="reviewContainer">

            <!-- JavaScript will load reviews here -->

        </div>

    </section>

    <footer>

        <p>

            © 2026 Property Hub System | All Rights Reserved.

        </p>

    </footer>

    <script src="reviews.js"></script>
    <script src="dark-mode.js"></script>

</body>

</html>
