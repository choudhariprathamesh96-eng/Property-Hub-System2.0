<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Property Hub</title>

<link rel="stylesheet" href="notifications.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        <h2>Property Hub</h2>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="owner-dashboard.html">Dashboard</a>

        <a href="notifications.html" class="active">

            Notifications

        </a>

    </nav>

</header>

<!-- ================= PAGE TITLE ================= -->

<section class="page-title">

    <h1>

        <i class="fa-solid fa-bell"></i>

        Notifications

    </h1>

    <p>

        Stay updated with your latest activities.

    </p>

</section>

<!-- ================= SUMMARY ================= -->

<section class="summary">

    <div class="summary-card">

        <i class="fa-solid fa-bell"></i>

        <h2 id="notificationCount">0</h2>

        <p>Total Notifications</p>

    </div>

</section>

<!-- ================= ACTION BUTTONS ================= -->

<div class="top-actions">

    <button id="markReadBtn">

        <i class="fa-solid fa-check"></i>

        Mark All as Read

    </button>

    <button id="clearBtn">

        <i class="fa-solid fa-trash"></i>

        Clear All

    </button>

</div>

<!-- ================= NOTIFICATIONS ================= -->

<section class="notification-section">

    <div id="notificationContainer">

    </div>

</section>

<!-- ================= EMPTY ================= -->

<div id="emptyNotification" style="display:none;">

    <i class="fa-regular fa-bell-slash"></i>

    <h2>No Notifications</h2>

    <p>

        You're all caught up!

    </p>

</div>

<footer>

    © 2026 Property Hub System

</footer>

<script src="notifications.js"></script>
<script src="dark-mode.js"></script>

</body>

</html>
