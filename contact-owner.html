<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Owner | Property Hub</title>

    <link rel="stylesheet" href="contact-owner.css">
    <link rel="stylesheet" href="theme.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="contact-box">

        <h1>
            <i class="fa-solid fa-envelope"></i>
            Contact Property Owner
        </h1>

        <p class="subtitle">
            Fill in your details and the owner will contact you shortly.
        </p>

        <form id="contactForm">

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-user"></i>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-envelope"></i>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-phone"></i>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your mobile number"
                    maxlength="10"
                    required>

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-building"></i>
                    Property Name
                </label>

                <input
                    type="text"
                    id="property"
                    readonly>

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-calendar"></i>
                    Preferred Visit Date
                </label>

                <input
                    type="date"
                    id="visitDate"
                    required>

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-message"></i>
                    Message
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Write your enquiry..."
                    required></textarea>

            </div>

            <button type="submit">

                <i class="fa-solid fa-paper-plane"></i>

                Send Enquiry

            </button>

            <a href="index.html" class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </form>

    </div>

</div>

<script src="contact-owner.js"></script>
<script src="dark-mode.js"></script>

</body>

</html>
