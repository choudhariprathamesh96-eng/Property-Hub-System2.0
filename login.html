<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Hub - Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="theme.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Left Side -->
    <div class="left-panel">

        <h1> Property Hub</h1>

        <h2>Find Your Dream Property</h2>

        <p>
            Buy, Sell, Rent and Explore verified properties across India.
        </p>

    </div>

    <!-- Right Side -->
    <div class="right-panel">

        <!-- LOGIN FORM -->

        <form id="loginForm" class="form active">

            <h2>Login</h2>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter Email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter Password" required>
            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button class="btn" type="submit">

                Login

            </button>

            <p>

                Don't have an account?

                <a href="#" id="showRegister">

                    Register Now

                </a>

            </p>

        </form>

        <!-- REGISTER FORM -->

        <form id="registerForm" class="form">

            <h2>Create Account</h2>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="Enter Full Name">
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="mobile" placeholder="Enter Mobile Number">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="Enter Email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Enter Password">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
            </div>

            <button class="btn" type="submit">

                Register

            </button>

            <p>

                Already have an account?

                <a href="#" id="showLogin">

                    Login

                </a>

            </p>

        </form>

    </div>

</div>

<script src="auth.js"></script>
<script src="dark-mode.js"></script>

</body>

</html>
