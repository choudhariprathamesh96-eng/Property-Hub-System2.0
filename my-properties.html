<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Properties | Property Hub</title>

    <link rel="stylesheet" href="my-properties.css">
    <link rel="stylesheet" href="theme.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">
            <h2>Property Hub</h2>
        </div>

        <ul>

            <li>
                <a href="owner-dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="my-properties.html">
                    <i class="fa-solid fa-building"></i>
                    My Properties
                </a>
            </li>

            <li>
                <a href="add-property.html">
                    <i class="fa-solid fa-plus"></i>
                    Add Property
                </a>
            </li>

            <li>
                <a href="bookings.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- ================= Main Content ================= -->

    <main class="main-content">

        <!-- Top Bar -->

        <header class="topbar">

            <div>

                <h1>My Properties</h1>

                <p>Manage all your listed properties.</p>

            </div>

            <a href="add-property.html" class="add-btn">

                <i class="fa-solid fa-plus"></i>

                Add Property

            </a>

        </header>

        <!-- Search & Filter -->

        <section class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search Property">

            <select id="typeFilter">

                <option value="All">All Types</option>

                <option value="Apartment">Apartment</option>

                <option value="Villa">Villa</option>

                <option value="Office">Office</option>

                <option value="Shop">Shop</option>

                <option value="PG">PG</option>

            </select>

        </section>

        <!-- Property Cards -->

        <section
            class="property-grid"
            id="propertyContainer">

        </section>

    </main>

    <script src="my-properties.js"></script>
    <script src="dark-mode.js"></script>

</body>

</html>
